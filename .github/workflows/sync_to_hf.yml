name: Sync to Hugging Face hub
on:
  push:
    branches: [chanho] # 현재 찬호 님이 작업 중인 브랜치 이름으로 맞춰주세요!

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://ichanho:$HF_TOKEN@huggingface.co/spaces/ichanho/chanho main
